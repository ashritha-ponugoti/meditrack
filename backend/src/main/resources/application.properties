# ===== Default: H2 in-memory DB - zero setup, for running locally =====
# To use Neon/Postgres instead, set these environment variables when running:
#   DB_URL=jdbc:postgresql://<neon-host>/<db>?sslmode=require
#   DB_USERNAME=<neon-username>
#   DB_PASSWORD=<neon-password>
# and they will override the H2 defaults below.

spring.datasource.url=${DB_URL:jdbc:h2:mem:meditrack;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}

# CORS - set to your deployed Vercel URL in production
meditrack.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# App-level tunables used by services
meditrack.anomaly.min-transactions=${ANOMALY_MIN_TX:15}
meditrack.anomaly.zscore-threshold=${ANOMALY_ZSCORE:2.5}
meditrack.expiry.warning-days=${EXPIRY_WARNING_DAYS:60}
meditrack.expiry.critical-days=${EXPIRY_CRITICAL_DAYS:20}

# JWT - override JWT_SECRET in production, never commit a real secret
meditrack.jwt.secret=${JWT_SECRET:dev-only-secret-change-before-deploying-1234567890}
meditrack.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
